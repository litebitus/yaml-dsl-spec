version: "1"
dsls:
  - id: mock-stack
    file_includes: ["{config_root}/**/stack.yml"]
    file_excludes: []
    schema_search_paths: ["{config_root}/mock-stack.schema.json"]
    tag_keys:
      - { tag: "!Ref", key: Ref }
      - { tag: "!GetAtt", key: "Fn::GetAtt" }
    key_sort_orders: []
    scopes:
      RESOURCE:
        regions: ["$"]
        later_items_of_declaring_list: false
        named_by_parent_key: false
        builtin_names: []
    declarations:
      - path: "$.Resources.*"
        skip_keys: []
        exclude_candidates: []
        name_source: key
        key_token: all_words
        name_spelling: as_written
        meta_argument_name: null
        declares_every_name: false
        scope_name: RESOURCE
    references:
      - pattern: "^!Ref (?<name>[A-Za-z0-9]+)$"
        positions: [whole_scalar]
        text_after_name_allowed: false
        scope_name: RESOURCE
        scope_group: null
        name_group: name
      - pattern: "^!GetAtt (?<name>[A-Za-z0-9]+)\\."
        positions: [whole_scalar]
        text_after_name_allowed: true
        scope_name: RESOURCE
        scope_group: null
        name_group: name
