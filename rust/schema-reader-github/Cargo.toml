[package]
name = "yaml-dsl-spec-schema-reader-github"
version.workspace = true
edition = "2024"
license = "MIT"
description = "The YAML DSL standard's reader of schema URLs on GitHub, a release asset read through GitHub's API with the machine's tokens."
readme = "README.md"
repository = "https://github.com/litebitus/yaml-dsl-spec"
keywords = [
    "dsl",
    "github",
    "json-schema",
    "yaml",
]
categories = ["development-tools", "config"]
include = ["/README.md", "/src/**"]

[lib]
name = "yaml_dsl_spec_schema_reader_github"

[dependencies]
serde_json = "1.0.154"
yaml-dsl-spec.workspace = true

[dev-dependencies]
tiny_http = "0.12.0"
