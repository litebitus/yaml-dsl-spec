name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        run: rustup toolchain install

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Test
        run: make test
