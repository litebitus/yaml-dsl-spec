name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level: auto (from Conventional Commits, never across a major), patch, minor or major."
        required: true
        type: choice
        options: [auto, patch, minor, major]
        default: patch
      dry_run:
        description: "Compute and print the next version without changing anything."
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install cargo-llvm-cov
        env:
          ARCHIVE: ${{ runner.temp }}/cargo-llvm-cov.tar.gz
        run: |
          set -euo pipefail
          source .github/cargo-llvm-cov.env
          curl -fsSL -o "$ARCHIVE" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_LLVM_COV_X86_64_LINUX_SHA256}  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$HOME/.cargo/bin"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.3
          cache: false

      - name: Test
        run: make test

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@v3.4.1

      - name: Compute the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            patch|minor|major) next="$(svu "$BUMP")" ;;
            auto)
              next="$(svu next)"
              if [ "${next%%.*}" != "$(svu current | cut -d. -f1)" ]; then
                next="$(svu minor)"
              fi
              ;;
          esac
          current="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '(none)')"
          if [ "$next" = "$current" ]; then
            echo "no version change ($next); nothing to release" >&2
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Current: $current -> Next: $next"

      - name: Check the release before changing anything
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/${NEXT}")" ]; then
            echo "tag $NEXT already exists on origin" >&2
            exit 1
          fi
          awk '/^## Unreleased$/ { inside = 1; next } /^## / { inside = 0 } inside && NF { found = 1 } END { exit !found }' CHANGELOG.md ||
            { echo "CHANGELOG.md has nothing under '## Unreleased' to release as $NEXT" >&2; exit 1; }
          mkdir -p rust/schemas
          cp schemas/*.schema.json rust/schemas/
          cargo publish --workspace --manifest-path rust/Cargo.toml --dry-run --allow-dirty

      - name: Check the package before changing anything
        working-directory: javascript
        run: npm pack --dry-run

      - name: Stamp the changelog and every package's version, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          awk '/^## Unreleased$/ { inside = 1; next } /^## / { inside = 0 } inside' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          sed -i "s/^## Unreleased$/## Unreleased\n\n## ${NEXT} — $(date -u +%Y-%m-%d)/" CHANGELOG.md
          sed -i "0,/^version = \".*\"$/s//version = \"${NEXT#v}\"/" rust/Cargo.toml
          sed -i "s/^yaml-dsl-spec = { path = \"\.\", version = \"=.*\" }$/yaml-dsl-spec = { path = \".\", version = \"=${NEXT#v}\" }/" rust/Cargo.toml
          cargo update --workspace --manifest-path rust/Cargo.toml
          jq --arg version "${NEXT#v}" '.version = $version' javascript/package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" javascript/package.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md rust/Cargo.toml rust/Cargo.lock javascript/package.json
          git commit -m "docs(changelog): ${NEXT}"
          git tag -a "$NEXT" -m "Release $NEXT"
          go -C go generate ./...
          git add --force go/schemas
          git commit -m "chore(go): the schemas of ${NEXT}"
          git tag -a "go/${NEXT}" -m "Release go/${NEXT}"
          git push --atomic origin "${NEXT}^{commit}:refs/heads/${GITHUB_REF_NAME}" "$NEXT" "go/${NEXT}"

      - name: Publish the crates
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --manifest-path rust/Cargo.toml --allow-dirty

      - name: Publish the JS package
        if: ${{ !inputs.dry_run }}
        working-directory: javascript
        run: npm publish

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          node javascript/scripts/release-assets.js "$RUNNER_TEMP/assets"
          gh release create "$NEXT" "$RUNNER_TEMP"/assets/*.schema.json --title "$NEXT" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse --short=7 "${NEXT}^{commit}")"
          echo "Published \`yaml-dsl-spec\` \`${NEXT#v}\` to crates.io and npm and tagged the Go module \`go/${NEXT}\`, from commit \`${commit}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: echo "DRY RUN - would release ${{ steps.version.outputs.next }}"
