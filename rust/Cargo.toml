[package]
name = "yaml-dsl-spec"
version.workspace = true
edition = "2024"
license = "MIT"
description = "The YAML DSL standard: the JSON Schemas of yaml-dsl.yml and of a DSL's function table, and the types of a DSL's definition."
readme = "README.md"
repository = "https://github.com/litebitus/yaml-dsl-spec"
keywords = [
    "yaml",
    "dsl",
    "json-schema",
    "spec",
]
categories = ["development-tools", "config"]
include = [
    "/build.rs",
    "/README.md",
    "/schema_versions.rs",
    "/schemas/*.json",
    "/core/**",
    "/tests/**",
]

[lib]
path = "core/lib.rs"

[dependencies]
fancy-regex = "0.20.0"
jsonschema = { version = "0.60.2", default-features = false }
saphyr-parser = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
ureq = "3.5.2"

[dev-dependencies]
tiny_http = "0.12.0"

[workspace]
members = [
    "diagnostic-renderer",
    "schema-reader-github",
    "schema-reader-s3",
]

[workspace.package]
version = "0.4.1"

[workspace.dependencies]
yaml-dsl-spec = { path = ".", version = "=0.4.1" }
