[package]
name = "yaml-dsl-spec-schema-reader-s3"
version.workspace = true
edition = "2024"
license = "MIT"
description = "The YAML DSL standard's reader of schema URLs on S3, `s3://<bucket>/<key>`, read with the AWS SDK."
readme = "README.md"
repository = "https://github.com/litebitus/yaml-dsl-spec"
keywords = [
    "dsl",
    "json-schema",
    "s3",
    "yaml",
]
categories = ["development-tools", "config"]
include = ["/README.md", "/src/**"]

[lib]
name = "yaml_dsl_spec_schema_reader_s3"

[dependencies]
aws-config = "1.13.4"
aws-sdk-s3 = "1.162.0"
aws-types = "1.7.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
yaml-dsl-spec.workspace = true

[dev-dependencies]
aws-smithy-types = "1.9.5"
